[package]
name = "posthog-stateful-ffi"
license = "MIT"
version = "0.0.1"
authors = ["PostHog <engineering@posthog.com>"]
description = "C bindings for the stateful PostHog Rust SDK, for C, C++, and game engine applications."
repository = "https://github.com/PostHog/posthog-rs"
edition = "2021"
publish = false

[lib]
name = "posthog_stateful_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
posthog = { git = "https://github.com/PostHog/posthog-rs.git", rev = "9cad3ee2a8a9313fbda2d9c0ad80db9e3e8ce812", default-features = false, features = ["tls", "session-replay"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
flate2 = "1"
httpmock = "0.9"
tempfile = "3"
