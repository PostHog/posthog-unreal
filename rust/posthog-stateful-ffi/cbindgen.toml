language = "C"
cpp_compat = true
include_guard = "POSTHOG_STATEFUL_H"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
usize_is_size_t = true
documentation_style = "doxy"
header = """
/*
 * C bindings for the stateful PostHog Rust SDK.
 *
 * Generated by cbindgen from rust/posthog-stateful-ffi/src/lib.rs.
 *
 * Ownership: every `*_new` handle and every `char *` written to an `_out`
 * argument belongs to the caller, who frees it with the matching `*_free`
 * function or `posthog_string_free`. `const char *` arguments are borrowed
 * for the duration of the call and must be NUL-terminated UTF-8.
 *
 * Special ownership transfers:
 * - `posthog_stateful_client_new` consumes the inner configuration (so `config`
 *   cannot be mutated or reused for a second client), while the caller must
 *   still free the outer handle with `posthog_stateful_config_free(config)`.
 * - `posthog_stateful_replay_submit_frame` ALWAYS consumes and frees `frame`
 *   (even on error); never call `posthog_stateful_replay_frame_free` afterwards.
 *   Use `posthog_stateful_replay_frame_free` only to abandon an unsubmitted frame.
 *
 * Threads: a `PostHogStatefulClient` can be shared between threads. Do not
 * use one `PostHogStatefulConfig` or `PostHogReplayFrame` from several
 * threads at once, and do not free a client while other threads are calling
 * into it or from inside one of its callbacks.
 *
 * Errors: calls return `POSTHOG_STATUS_OK` or an error status, and
 * constructors return NULL on error. `posthog_last_error` describes the last
 * error on the calling thread. The free functions leave it unchanged.
 */
"""

[export]
include = [
    "PostHogStatus",
    "PostHogPersonProfiles",
    "PostHogSessionMode",
    "PostHogFlagReporting",
    "PostHogCaptureOutcome",
    "PostHogPersistenceOutcome",
    "PostHogDeliveryOutcome",
    "PostHogDrainReport",
    "PostHogFrameUnavailable",
    "PostHogSubmitOutcome",
]
