[package]
name = "posthog-unreal-ffi"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
posthog-rs = { git = "ssh://git@github.com/PostHog/posthog-rs.git", rev = "b0038bde4f8ea39b6440ddc9fde376ac602c5b65", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
