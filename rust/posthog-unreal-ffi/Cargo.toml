[package]
name = "posthog-unreal-ffi"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
posthog-rs = { package = "posthog", git = "ssh://git@github.com/PostHog/posthog-rs.git", rev = "b717aef23d4869bdf94e75ce36bbd383d3575c6f", default-features = false, features = ["tls", "session-replay"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
uuid = { version = "1", features = ["serde"] }
