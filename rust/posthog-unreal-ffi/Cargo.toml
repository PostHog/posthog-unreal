[package]
name = "posthog-unreal-ffi"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
posthog-rs = { package = "posthog", git = "ssh://git@github.com/PostHog/posthog-rs.git", rev = "9cad3ee2a8a9313fbda2d9c0ad80db9e3e8ce812", default-features = false, features = ["tls", "session-replay"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["serde"] }
