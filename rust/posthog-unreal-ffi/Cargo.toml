[package]
name = "posthog-unreal-ffi"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
posthog-rs = { git = "ssh://git@github.com/PostHog/posthog-rs.git", rev = "934113e63b9ad292de45d7db0af53913eb6eb117", default-features = false, features = ["tls", "embedding"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
