name: Bug report
description: Report something that is not working as expected.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: SDK version or commit
      description: Include the commit hash if you are building from source.
    validations:
      required: true
  - type: input
    id: engine-version
    attributes:
      label: Unreal Engine version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Include the operating system and whether this occurs in the editor or a packaged build.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include a minimal reproduction if possible. Remove credentials and personal data from logs and screenshots.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
