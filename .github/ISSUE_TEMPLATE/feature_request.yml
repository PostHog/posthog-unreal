name: Feature request
description: Tell us about a problem the SDK could solve.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do, and what is preventing it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe your preferred solution and any alternatives you considered.
    validations:
      required: false
