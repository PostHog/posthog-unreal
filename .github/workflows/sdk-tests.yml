name: SDK tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      unreal:
        description: Build the Unreal fixture and validate prepared-pixel replay (requires engine archives)
        type: boolean
        default: false
  # The Release workflow verifies its uncommitted version patch with these same jobs.
  workflow_call:
    inputs:
      ref:
        description: 'Immutable source commit to verify'
        type: string
        required: false
        default: ''
      candidate-patch-sha256:
        description: 'Checksum of the release-candidate patch, empty for normal CI'
        type: string
        required: false
        default: ''
      candidate-tree-sha:
        type: string
        required: false
        default: ''
      candidate-version:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Release candidates never cancel, or get cancelled by, ordinary CI runs.
  group: sdk-tests-${{ github.workflow }}-${{ inputs.candidate-tree-sha || github.ref }}
  cancel-in-progress: ${{ inputs.candidate-patch-sha256 == '' }}

jobs:
  tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate-patch-sha256 != ''
        with:
          name: release-candidate-${{ inputs.ref }}
          path: artifacts/release-candidate
      - name: Apply and validate release candidate
        if: inputs.candidate-patch-sha256 != ''
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.ref }}
          PATCH_SHA256: ${{ inputs.candidate-patch-sha256 }}
          TREE_SHA: ${{ inputs.candidate-tree-sha }}
          VERSION: ${{ inputs.candidate-version }}
        run: |
          python scripts/release_candidate.py artifacts/release-candidate/release.patch \
            --source "$SOURCE_SHA" --sha256 "$PATCH_SHA256" --tree "$TREE_SHA" --version "$VERSION"
      - run: python -m pip install -r Tests/requirements.txt
      - run: python -m unittest discover -s Tests -p "test_*.py" -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Release failure notifier tests
        run: node --test scripts/release-failure-notification.test.cjs
      - name: Report native CI prerequisites
        shell: bash
        env:
          MOCK_SHA: ${{ vars.SDK_MOCK_ARCHIVE_SHA256 }}
        run: |
          if [[ -z "$MOCK_SHA" ]]; then
            echo 'Native/Unreal validation is pending: configure the maintained mock artifact.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo 'Native/Unreal validation uses protected artifacts; run it on a trusted ref with workflow_dispatch.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check tested candidate is unchanged
        if: inputs.candidate-patch-sha256 != ''
        shell: bash
        env:
          TREE_SHA: ${{ inputs.candidate-tree-sha }}
        run: |
          git diff --exit-code
          test "$(git write-tree)" = "$TREE_SHA"

  bundle:
    # Builds each release library on its native runner. No secrets: posthog-rs is fetched over HTTPS.
    name: bundle (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.96.1
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.candidate-patch-sha256 != ''
        with:
          name: release-candidate-${{ inputs.ref }}
          path: artifacts/release-candidate
      - name: Apply and validate release candidate
        if: inputs.candidate-patch-sha256 != ''
        env:
          SOURCE_SHA: ${{ inputs.ref }}
          PATCH_SHA256: ${{ inputs.candidate-patch-sha256 }}
          TREE_SHA: ${{ inputs.candidate-tree-sha }}
          VERSION: ${{ inputs.candidate-version }}
        run: |
          python scripts/release_candidate.py artifacts/release-candidate/release.patch \
            --source "$SOURCE_SHA" --sha256 "$PATCH_SHA256" --tree "$TREE_SHA" --version "$VERSION"
      - name: Install pinned Rust and its redistribution notices
        run: rustup toolchain install 1.96.1 --profile minimal --component rust-docs --target ${{ matrix.target }}
      - name: Build and test the native library
        run: python scripts/build-native.py ${{ matrix.target }} --test
      - name: Install license notice generator
        run: cargo install cargo-about --version 0.9.3 --locked --features cli
      - name: Generate dependency notices
        run: |
          mkdir -p artifacts/notices
          cargo about generate --manifest-path rust/Cargo.toml --locked --fail \
            --target "${{ matrix.target }}" scripts/third-party-notices.hbs \
            --output-file artifacts/notices/THIRD_PARTY_NOTICES.txt
      - name: Stage native library and redistribution material
        run: >-
          python scripts/package-plugin.py stage ${{ matrix.target }}
          --notices artifacts/notices/THIRD_PARTY_NOTICES.txt
      - name: Check tested candidate is unchanged
        if: inputs.candidate-patch-sha256 != ''
        env:
          TREE_SHA: ${{ inputs.candidate-tree-sha }}
        run: |
          git diff --exit-code
          test "$(git write-tree)" = "$TREE_SHA"
      # Release publication assembles the plugin ZIP from exactly these verified bundles.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.candidate-patch-sha256 != ''
        with:
          name: posthog-native-${{ matrix.target }}
          path: artifacts/native/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 5

  native:
    # Protected engine/mock assets are never exposed to pull-request code. Release candidates skip
    # this job so publication needs only the Release approval; run it on main or by dispatch.
    if: github.event_name != 'pull_request' && inputs.candidate-patch-sha256 == '' && vars.SDK_MOCK_ARCHIVE_SHA256 != ''
    environment: sdk-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            library: libposthog_unreal_ffi.so
            editor: Engine/Binaries/Linux/UnrealEditor
            engine_url: UE_LINUX_ARCHIVE_URL
            engine_sha: UE_LINUX_ARCHIVE_SHA256
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            library: posthog_unreal_ffi.dll
            editor: Engine/Binaries/Win64/UnrealEditor.exe
            engine_url: UE_WINDOWS_ARCHIVE_URL
            engine_sha: UE_WINDOWS_ARCHIVE_SHA256
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: 1.96.1
      UE_ROOT: ${{ github.workspace }}/.ci/UnrealEngine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Restore maintained mock server
        env:
          CI_ARCHIVE_URL: ${{ secrets.SDK_MOCK_ARCHIVE_URL }}
          CI_ARCHIVE_SHA256: ${{ vars.SDK_MOCK_ARCHIVE_SHA256 }}
        run: python scripts/restore-ci-archive.py "${{ runner.temp }}/sdk-mock-server"
      - run: rustup toolchain install 1.96.1 --profile minimal
      - run: python -m pip install -r Tests/requirements.txt
      - name: Build native library and run bridge tests
        run: python scripts/build-native.py ${{ matrix.target }} --test
      - name: Native wire and lifecycle tests
        run: >-
          python Tests/native_integration.py
          --library "${{ github.workspace }}/rust/target/${{ matrix.target }}/release/${{ matrix.library }}"
          --mock-server "${{ runner.temp }}/sdk-mock-server/server.py"
      - name: Restore authorized UE 5.8 installed build
        if: inputs.unreal
        env:
          CI_ARCHIVE_URL: ${{ secrets[matrix.engine_url] }}
          CI_ARCHIVE_SHA256: ${{ vars[matrix.engine_sha] }}
        run: python scripts/restore-ci-archive.py "${{ env.UE_ROOT }}"
      - name: Install software-rendering prerequisites
        if: inputs.unreal && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-vulkan-drivers vulkan-tools libxkbcommon-x11-0 libxcb-cursor0
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Compile Unreal runtime and Blueprint automation
        if: inputs.unreal
        run: python scripts/build-test-host.py
      - name: Unreal headless automation and wire assertions
        if: inputs.unreal
        run: >-
          python Tests/native_integration.py
          --library "${{ github.workspace }}/rust/target/${{ matrix.target }}/release/${{ matrix.library }}"
          --mock-server "${{ runner.temp }}/sdk-mock-server/server.py"
          --editor "${{ env.UE_ROOT }}/${{ matrix.editor }}"
      - name: Validate synthetic prepared screenshots in the engine fixture
        if: inputs.unreal
        run: >-
          python Tests/replay_smoke.py
          --editor "${{ env.UE_ROOT }}/${{ matrix.editor }}"
          --mock-server "${{ runner.temp }}/sdk-mock-server/server.py"
          --renderer software
      - name: Upload test evidence (not engine files)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-evidence-${{ matrix.os }}
          path: |
            artifacts/editor-integration/
            artifacts/replay-smoke/
            Source/ThirdParty/PostHogRust/lib/*/manifest.json
          retention-days: 7
          if-no-files-found: ignore
