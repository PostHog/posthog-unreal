name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or retry (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    environment: Release
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Require SSH checkout configuration
        env:
          SSH_KEY: ${{ secrets.SDK_GIT_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.SDK_GIT_KNOWN_HOSTS }}
        run: test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          ssh-key: ${{ secrets.SDK_GIT_SSH_KEY }}
          ssh-known-hosts: ${{ vars.SDK_GIT_KNOWN_HOSTS }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate and pin the release commit
        id: source
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          python scripts/release.py notes --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: python -m pip install -r Tests/requirements.txt
      - run: python -m unittest discover -s Tests -p 'test_*.py' -v

  native:
    needs: validate
    environment: Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.96.1
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - name: Require SSH checkout configuration
        env:
          SSH_KEY: ${{ secrets.SDK_GIT_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.SDK_GIT_KNOWN_HOSTS }}
        run: test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          ssh-key: ${{ secrets.SDK_GIT_SSH_KEY }}
          ssh-known-hosts: ${{ vars.SDK_GIT_KNOWN_HOSTS }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r Tests/requirements.txt
      - run: python -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Configure read-only SSH access for the pinned Rust dependency
        env:
          SSH_KEY: ${{ secrets.SDK_GIT_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.SDK_GIT_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/sdk-git-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/sdk-git-known-hosts"
          printf "GIT_SSH_COMMAND=ssh -i '%s' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='%s'\n" "$RUNNER_TEMP/sdk-git-key" "$RUNNER_TEMP/sdk-git-known-hosts" >> "$GITHUB_ENV"
      - name: Install pinned Rust and its redistribution notices
        run: rustup toolchain install 1.96.1 --profile minimal --component rust-docs --target ${{ matrix.target }}
      - name: Build and test the native library
        run: python scripts/build-native.py ${{ matrix.target }} --test
      - name: Install license notice generator
        run: cargo install cargo-about --version 0.9.3 --locked --features cli
      - name: Generate dependency notices
        run: |
          mkdir -p artifacts/notices
          cargo about generate --manifest-path rust/Cargo.toml --locked --fail \
            --target "${{ matrix.target }}" scripts/third-party-notices.hbs \
            --output-file artifacts/notices/THIRD_PARTY_NOTICES.txt
      - name: Stage native library and redistribution material
        run: >-
          python scripts/package-plugin.py stage ${{ matrix.target }}
          --notices artifacts/notices/THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: posthog-native-${{ matrix.target }}
          path: artifacts/native/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  release:
    needs: [validate, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: Release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require SSH checkout configuration
        env:
          SSH_KEY: ${{ secrets.SDK_GIT_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.SDK_GIT_KNOWN_HOSTS }}
        run: test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          ssh-key: ${{ secrets.SDK_GIT_SSH_KEY }}
          ssh-known-hosts: ${{ vars.SDK_GIT_KNOWN_HOSTS }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: posthog-native-*
          path: artifacts/native/
          merge-multiple: true
      - name: Assemble the three-platform plugin ZIP and checksum
        run: python scripts/package-plugin.py package
      - name: Validate tag and extract release notes
        run: |
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          python scripts/release.py notes --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release-notes.md"
          printf '\n### Installation\n\nDownload the plugin ZIP and extract PostHog/ into your C++ project Plugins/ directory. It bundles Mac arm64, Linux x64 and Windows x64 native libraries for UE 5.8. Unreal compiles the C++ modules; Rust is not required.\n' >> "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub plugin release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          archive="artifacts/releases/PostHog-${RELEASE_TAG}.zip"
          checksum="${archive}.sha256"
          ARCHIVE_NAME=$(basename "$archive")
          export ARCHIVE_NAME
          if gh release view "$RELEASE_TAG" --json isDraft,assets > "$RUNNER_TEMP/existing-release.json"; then
            state=$(python -c 'import json,sys; print("draft" if json.load(open(sys.argv[1]))["isDraft"] else "published")' "$RUNNER_TEMP/existing-release.json")
            if [[ "$state" == published ]]; then
              python -c 'import json,os,sys; names={a["name"] for a in json.load(open(sys.argv[1]))["assets"]}; expected={os.environ["ARCHIVE_NAME"],os.environ["ARCHIVE_NAME"]+".sha256"}; sys.exit("Published release is missing plugin assets; inspect it manually") if not expected <= names else None' "$RUNNER_TEMP/existing-release.json"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "PostHog Unreal $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          # Keep partial uploads in a draft. Retries may replace draft assets, never published assets.
          gh release upload "$RELEASE_TAG" "$archive" "$checksum" --clobber
          prerelease=$(python scripts/release.py check --tag "$RELEASE_TAG" | python -c 'import json,sys; print(str(json.load(sys.stdin)["prerelease"]).lower())')
          latest=true
          if [[ "$prerelease" == true ]]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" --latest="$latest"
