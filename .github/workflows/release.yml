name: Release

on:
  push:
    branches: [main]
    paths: ['.changeset/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-candidate:
    name: Prepare release candidate
    if: github.repository == 'PostHog/posthog-unreal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source-sha: ${{ steps.plan.outputs.source-sha }}
      tree-sha: ${{ steps.plan.outputs.tree-sha }}
      patch-sha256: ${{ steps.plan.outputs.patch-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Queued runs consume the intents still pending on main, not a stale push.
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11.13.1
          runtime: node@24
          install: false
      - name: Apply pending change intents without committing
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          old_version=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          pnpm version -r
          new_version=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          if [ "$old_version" = "$new_version" ]; then
            echo "No pending releasable change intents"
            exit 0
          fi
          python scripts/bump_version.py
          python scripts/release.py "$new_version" --check
          git add CHANGELOG.md package.json .changeset PostHog.uplugin rust/posthog-unreal-ffi/Cargo.toml rust/Cargo.lock
          mkdir -p artifacts/release-candidate
          git diff --cached --binary > artifacts/release-candidate/release.patch
          source_sha=$(git rev-parse HEAD)
          tree_sha=$(git write-tree)
          patch_sha256=$(sha256sum artifacts/release-candidate/release.patch | awk '{print $1}')
          {
            echo "version=$new_version"
            echo "source-sha=$source_sha"
            echo "tree-sha=$tree_sha"
            echo "patch-sha256=$patch_sha256"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release candidate $new_version"
            echo "Source commit: $source_sha"
            echo "Candidate tree: $tree_sha"
            echo "Patch SHA-256: $patch_sha256"
            echo "Review the release-candidate artifact before approving publication. No commit has been made."
            echo "Hosted CI cannot run Unreal Engine: complete the manual UE 5.8 validation in RELEASING.md before approving."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.version != ''
        with:
          name: release-candidate-${{ steps.plan.outputs.source-sha }}
          path: artifacts/release-candidate/release.patch
          if-no-files-found: error
          retention-days: 5
          overwrite: true

  verify:
    needs: prepare-candidate
    if: needs.prepare-candidate.outputs.version != ''
    uses: ./.github/workflows/sdk-tests.yml
    with:
      ref: ${{ needs.prepare-candidate.outputs.source-sha }}
      candidate-patch-sha256: ${{ needs.prepare-candidate.outputs.patch-sha256 }}
      candidate-tree-sha: ${{ needs.prepare-candidate.outputs.tree-sha }}
      candidate-version: ${{ needs.prepare-candidate.outputs.version }}

  notify-approval-needed:
    name: Notify Slack - Approval Needed
    needs: verify
    uses: posthog/.github/.github/workflows/notify-approval-needed.yml@5ba5d24966f2c416ca792654638e4ce6f19f545b # main
    with:
      slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
      slack_user_group_id: ${{ vars.GROUP_CLIENT_LIBRARIES_SLACK_GROUP_ID }}
      checkout_repository: false
      tag_pattern: '[0-9]*'
      tag_sort: version
    secrets:
      slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
      posthog_project_api_key: ${{ secrets.POSTHOG_PROJECT_API_KEY }}

  preserve-slack-thread:
    name: Preserve Slack thread
    needs: notify-approval-needed
    if: needs.notify-approval-needed.outputs.slack_ts != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Save approval thread timestamp
        env:
          THREAD_TS: ${{ needs.notify-approval-needed.outputs.slack_ts }}
        run: printf '%s' "$THREAD_TS" > thread-ts.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-slack-thread-${{ github.run_attempt }}
          path: thread-ts.txt
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Commit and publish approved release
    needs: [prepare-candidate, verify, notify-approval-needed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Release
    steps:
      - name: Notify Slack - Approved
        if: needs.notify-approval-needed.outputs.slack_ts != ''
        uses: posthog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "✅ Release approved! Publishing release…"
          emoji_reaction: "white_check_mark"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-candidate.outputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ needs.prepare-candidate.outputs.source-sha }}
          path: artifacts/release-candidate
      - name: Apply the verified candidate
        env:
          SOURCE_SHA: ${{ needs.prepare-candidate.outputs.source-sha }}
          PATCH_SHA256: ${{ needs.prepare-candidate.outputs.patch-sha256 }}
          TREE_SHA: ${{ needs.prepare-candidate.outputs.tree-sha }}
          VERSION: ${{ needs.prepare-candidate.outputs.version }}
        run: |
          python scripts/release_candidate.py artifacts/release-candidate/release.patch \
            --source "$SOURCE_SHA" --sha256 "$PATCH_SHA256" --tree "$TREE_SHA" --version "$VERSION"
      # Verify assembled this ZIP from this exact candidate tree and its bundles; publish uploads those bytes.
      # Validate it before the irreversible version commit, so a missing or invalid ZIP leaves main untouched.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: posthog-unreal-candidate
          path: artifacts/releases
      - name: Validate the verified plugin ZIP
        env:
          VERSION: ${{ needs.prepare-candidate.outputs.version }}
          ZIP_SHA256: ${{ needs.verify.outputs.candidate-zip-sha256 }}
        run: |
          set -euo pipefail
          python -m unittest discover -s Tests -p 'test_release*.py'
          # Re-runs keep every attempt's same-named artifact; require the ZIP the latest assemble attempt reported.
          test -n "$ZIP_SHA256" || { echo "::error::verify reported no candidate ZIP checksum (candidate-zip-sha256); dispatch a fresh release run"; exit 1; }
          echo "$ZIP_SHA256  posthog-unreal-$VERSION.zip" | (cd artifacts/releases && sha256sum --check -)
          python scripts/release.py "$VERSION"
          git diff --exit-code
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: releaser
        with:
          client-id: ${{ secrets.GH_APP_POSTHOG_UNREAL_RELEASER_APP_ID }}
          private-key: ${{ secrets.GH_APP_POSTHOG_UNREAL_RELEASER_PRIVATE_KEY }}
          permission-contents: write
      - name: Create signed version commit without overwriting concurrent changes
        id: commit
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NEW_VERSION: ${{ needs.prepare-candidate.outputs.version }}
          EXPECTED_TREE_SHA: ${{ needs.prepare-candidate.outputs.tree-sha }}
        run: python scripts/commit_release.py
      - name: Check out the signed commit and verify its tested tree
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
          TREE_SHA: ${{ needs.prepare-candidate.outputs.tree-sha }}
          VERSION: ${{ needs.prepare-candidate.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TREE_SHA"
          git diff --exit-code
          python scripts/release.py "$VERSION" --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            artifacts/releases/posthog-unreal-*.zip
            artifacts/releases/SHA256SUMS
          if-no-files-found: error
          overwrite: true
      - name: Verify immutable source and publish experimental prerelease
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare-candidate.outputs.version }}
          SOURCE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cd artifacts/releases
          sha256sum --check SHA256SUMS
          tag_ref="refs/tags/$VERSION"
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$VERSION" --jq ".[] | select(.ref == \"$tag_ref\") | .ref")
          if [ -n "$existing" ]; then
            test "$(gh api "repos/$GH_REPO/commits/$VERSION" --jq '.sha')" = "$SOURCE_SHA"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="$tag_ref" -f sha="$SOURCE_SHA"
          fi
          gh release create "$VERSION" "posthog-unreal-${VERSION}.zip" SHA256SUMS \
            --repo "$GH_REPO" --verify-tag --prerelease --latest=false \
            --title "PostHog Unreal $VERSION (Experimental)" --generate-notes \
            --notes "Experimental UE 5.8 SDK for C++ projects. Download posthog-unreal-${VERSION}.zip below, not the automatic source archives, and copy its PostHog/ directory into your project's Plugins/ directory. It bundles prebuilt Mac arm64, Linux x64 and Windows x64 native libraries; Rust is not required. See https://github.com/PostHog/posthog-unreal/blob/${VERSION}/README.md#status for platform validation status and limitations, and the packaged README and CHANGELOG. Fab distribution is not available yet."

  notify-result:
    name: Notify Slack/PostHog - Release Result
    needs: [prepare-candidate, verify, notify-approval-needed, publish]
    if: always() && (failure() || cancelled() || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check whether release was rejected
        id: check-failure
        if: needs.notify-approval-needed.outputs.slack_ts != '' && (needs.publish.result == 'failure' || needs.publish.result == 'cancelled')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          rejected=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/approvals" --jq 'any(.[]; .state == "rejected")')
          echo "was_rejected=$rejected" >> "$GITHUB_OUTPUT"
      - name: Send failure event to PostHog
        if: steps.check-failure.outputs.was_rejected != 'true' && (failure() || needs.prepare-candidate.result == 'failure' || needs.verify.result == 'failure' || needs.publish.result == 'failure')
        continue-on-error: true
        uses: PostHog/posthog-github-action@9a6a19d360820ab4d95ecc4a5a7564062c895f84 # v1.3.0
        with:
          posthog-token: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          event: posthog-sdk-github-release-workflow-failure
          properties: >-
            {
              "repository": "${{ github.repository }}",
              "sdk": "posthog-unreal",
              "packageName": "posthog-unreal",
              "packageVersion": "${{ needs.prepare-candidate.outputs.version || 'unknown' }}",
              "actionUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "alertText": "posthog-unreal release failed"
            }
      - name: Notify Slack - Released
        if: always() && needs.publish.result == 'success' && needs.notify-approval-needed.outputs.slack_ts != ''
        uses: posthog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "🚀 posthog-unreal@${{ needs.prepare-candidate.outputs.version }} released successfully! <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
          emoji_reaction: "rocket"
      - name: Notify Slack - Rejected
        if: always() && steps.check-failure.outputs.was_rejected == 'true' && needs.notify-approval-needed.outputs.slack_ts != ''
        continue-on-error: true
        uses: posthog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "🚫 Release posthog-unreal@${{ needs.prepare-candidate.outputs.version }} was rejected. <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
          emoji_reaction: "no_entry_sign"
